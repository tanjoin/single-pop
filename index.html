<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>single-pop</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 32px 16px;
            background: #fff;
            color: #000;
            max-width: 360px;
        }
        label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        input {
            width: 100%;
            padding: 4px 0;
            font-size: 13px;
            border: none;
            border-bottom: 1px solid #000;
            outline: none;
            box-sizing: border-box;
            border-radius: 0;
        }
        .action {
            margin-top: 16px;
        }
        a {
            display: inline-block;
            background: #000;
            color: #fff;
            padding: 6px 12px;
            font-size: 12px;
            text-decoration: none;
            border-radius: 3px;
            cursor: grab;
        }
        .help {
            font-size: 11px;
            color: #666;
            margin-top: 6px;
        }
        .msg {
            font-size: 12px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

<div id="msg" class="msg">重複を検知したため閉じます...</div>

<div id="app">
    <label for="url">SLACK URL</label>
    <input type="text" id="url" placeholder="https://app.slack.com/client/...">
    <div class="action">
        <a id="bm" href="#" onclick="return false;">Slack Popup</a>
        <div class="help">上のボタンをブックマークバーへドラッグ＆ドロップしてください</div>
    </div>
</div>

<script>
(function() {
    // 中継ページ自体として開かれた場合の判定・重複チェックロジック
    const urlParams = new URLSearchParams(window.location.search);
    const targetSlackUrl = urlParams.get('url');

    if (targetSlackUrl) {
        document.getElementById('app').style.display = 'none';
        const msg = document.getElementById('msg');
        msg.style.display = 'block';

        const channelName = 'single_pop_channel';
        const bc = new BroadcastChannel(channelName);
        let responded = false;

        // すでに開いている既存ウィンドウからの PONG 受信
        bc.onmessage = (e) => {
            if (e.data === 'PONG') {
                responded = true;
                // 重複していたのでこの中継タブを閉じる
                bc.close();
                window.close();
            }
        };

        // 既存のウィンドウに問い合わせ
        bc.postMessage('PING');

        // 100ms 待って返答がなければ、新しいポップアップを開く
        setTimeout(() => {
            if (!responded) {
                const w = Math.floor(window.screen.width / 2);
                window.open(targetSlackUrl, 'SingleSlackPop', `width=${w},height=${window.screen.height},left=0,top=0,resizable=yes,scrollbars=yes`);
            }
            bc.close();
            // 処理完了後、この中継タブを閉じる
            window.close();
        }, 120);

        return;
    }

    // --- ブックマークレット生成ロジック ---
    const urlInput = document.getElementById('url');
    const bm = document.getElementById('bm');

    urlInput.addEventListener('input', () => {
        const val = urlInput.value.trim();
        if (!val) {
            bm.setAttribute('href', '#');
            return;
        }

        // 現在の中継ページのURLを取得（クエリパラメータとして target URL を追加）
        const currentUrl = window.location.href.split('?')[0];
        const proxyUrl = currentUrl + '?url=' + encodeURIComponent(val);

        // 新しいタブで中継ページを開くブックマークレットコード
        const code = `javascript:(() => { window.open('${proxyUrl}', '_blank'); })();`;

        bm.setAttribute('href', code);
    });
})();
</script>

</body>
</html>
