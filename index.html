<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slack Launcher</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 24px 16px;
            background: #ffffff;
            color: #000000;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border: 1px solid #000000;
            border-radius: 4px;
            padding: 20px;
        }
        h1 {
            font-size: 15px;
            margin: 0 0 12px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid #000000;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #000000;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px 10px;
            font-size: 13px;
            border: 1px solid #000000;
            border-radius: 2px;
            outline: none;
            background: #ffffff;
            color: #000000;
        }
        input[type="text"]:focus {
            border-width: 2px;
            padding: 7px 9px;
        }
        .bookmark-box {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #000000;
        }
        .bookmarklet-link {
            display: inline-block;
            padding: 8px 16px;
            background: #ffffff;
            color: #000000;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            border-radius: 2px;
            border: 1px solid #000000;
            cursor: grab;
        }
        .bookmarklet-link:hover {
            background: #000000;
            color: #ffffff;
        }
        .bookmarklet-link:active {
            cursor: grabbing;
        }
        .note {
            font-size: 11px;
            color: #333333;
            margin-top: 6px;
            line-height: 1.4;
        }
        .notice {
            padding: 10px;
            background: #ffffff;
            border: 1px solid #000000;
            color: #000000;
            border-radius: 2px;
            font-size: 12px;
            margin-bottom: 12px;
            display: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Slack Popup Launcher Generator</h1>

    <div id="duplicateNotice" class="notice">
        既存のポップアップを検知しました。このタブを閉じます...
    </div>

    <div class="form-group">
        <label for="slackUrl">遷移先 Slack URL</label>
        <input type="text" id="slackUrl" placeholder="https://app.slack.com/client/XXXXX/YYYYY">
    </div>

    <div class="bookmark-box">
        <a id="bmLink" class="bookmarklet-link" href="#" onclick="return false;">Slack ポップアップ</a>
        <div class="note">上のボタンをブックマークバーへドラッグしてください。<br>（URLを変えてドラッグすれば複数のSlack場所を登録できます）</div>
    </div>
</div>

<script>
(function() {
    const slackUrlInput = document.getElementById('slackUrl');
    const bmLink = document.getElementById('bmLink');
    const duplicateNotice = document.getElementById('duplicateNotice');

    // 現在の URL からパラメータ ?url= を取得
    const params = new URLSearchParams(window.location.search);
    const targetSlackUrl = params.get('url');

    // 中継ページの自身のベースURL（クエリパラメータを除く）
    const proxyBaseUrl = window.location.href.split('?')[0];

    // ブックマークレット生成
    function updateBookmarklet() {
        const slackTarget = slackUrlInput.value.trim();
        if (!slackTarget) {
            bmLink.setAttribute('href', '#');
            return;
        }

        // 中継ページURL に ?url=xxxx を付与
        const dest = `${proxyBaseUrl}?url=${encodeURIComponent(slackTarget)}`;
        const code = `javascript:(() => { const w = Math.floor(window.screen.width / 2); const h = window.screen.height; window.open("${dest}", "SlackPopupProxy", \`width=\${w},height=\${h},left=0,top=0,resizable=yes,scrollbars=yes\`); })();`;
        bmLink.setAttribute('href', code);
    }

    slackUrlInput.addEventListener('input', updateBookmarklet);

    // --- 重複制御 & 転送ロジック ---
    if (targetSlackUrl) {
        const bc = new BroadcastChannel('slack_popup_proxy_channel');
        let isDuplicate = false;

        bc.onmessage = (e) => {
            if (!e.data) return;
            if (e.data.type === 'PING') {
                bc.postMessage({ type: 'PONG' });
                window.focus();
            } else if (e.data.type === 'PONG') {
                isDuplicate = true;
                duplicateNotice.style.display = 'block';
                setTimeout(() => window.close(), 300);
            }
        };

        // 既存ウィンドウへ問い合わせ
        bc.postMessage({ type: 'PING' });

        // 応答がなければ指定先Slackへリダイレクト
        setTimeout(() => {
            if (!isDuplicate) {
                window.location.replace(targetSlackUrl);
            }
        }, 200);
    }
})();
</script>

</body>
</html>
